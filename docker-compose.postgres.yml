services:
  postgres:
    image: postgres:16-alpine
    container_name: a2-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: a2_store
      POSTGRES_USER: a2
      POSTGRES_PASSWORD: a2_dev_password
    ports:
      - "5432:5432"
    volumes:
      - a2_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2 -d a2_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  a2_pg_data:
